<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b111c">
<title>B737 Sim Prep</title>
<meta name="apple-mobile-web-app-title" content="Sim Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  /* Layout: one focused card per screen; the CDU drawing is the hero of each step. */
  :root {
    --bg: #eef1f5; --panel: #ffffff; --panel-2: #f5f7fa; --line: #d5dbe4;
    --text: #0e1622; --muted: #5a6577; --accent: #1d5fd1; --accent-ink: #ffffff;
    --go: #11804a; --go-bg: #e3f5eb; --amber: #9a5b00; --amber-bg: #fff2d6; --red: #b42318; --red-bg: #fde6e4;
    --focus: #1d5fd1;
    /* The CDU keeps its own colors in both themes, like the real box. */
    --cdu-body: #3a4049; --cdu-bezel: #2b3038; --cdu-key: #1d2127; --cdu-key-ink: #e9edf2;
    --cdu-screen: #05080b; --cdu-text: #e8f1ea; --cdu-dim: #7c8791; --cdu-hot: #ffcf4a; --cdu-hot-ink: #1a1300;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b111c; --panel: #131b29; --panel-2: #1a2436; --line: #2a364c;
      --text: #e8edf5; --muted: #94a1b8; --accent: #5b9bff; --accent-ink: #06101f;
      --go: #3ddc84; --go-bg: #0f2a1d; --amber: #ffbe3d; --amber-bg: #2d2210; --red: #ff6b5e; --red-bg: #321615;
      --focus: #8fbcff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b111c; --panel: #131b29; --panel-2: #1a2436; --line: #2a364c;
    --text: #e8edf5; --muted: #94a1b8; --accent: #5b9bff; --accent-ink: #06101f;
    --go: #3ddc84; --go-bg: #0f2a1d; --amber: #ffbe3d; --amber-bg: #2d2210; --red: #ff6b5e; --red-bg: #321615;
    --focus: #8fbcff; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; min-height: 100vh;
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }

  header.top {
    position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0 10px; }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 19px; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .progress { height: 5px; border-radius: 3px; background: var(--line); margin-bottom: 10px; overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--accent); transition: width .2s; }

  main { padding: 18px 0 24px; }
  h2.title { font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
  p.lead { margin: 0 0 18px; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .hint { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }

  .modes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .mode { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 18px; cursor: pointer; display: grid; gap: 6px; }
  .mode b { font-size: 18px; }
  .mode span { color: var(--muted); font-size: 14px; }
  .mode:hover { border-color: var(--accent); }

  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button { flex: 1 1 120px; min-width: 0; min-height: 52px; padding: 10px 6px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--panel-2); font-weight: 600; cursor: pointer; }
  .seg button small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .seg button[aria-pressed="true"] small { color: inherit; opacity: .85; }
  .toggles { display: grid; gap: 8px; }
  .tgl { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 12px 14px; cursor: pointer; min-height: 56px; }
  .tgl .txt { flex: 1; }
  .tgl .txt b { display: block; font-weight: 600; }
  .tgl .txt span { font-size: 13px; color: var(--muted); }
  .tgl .sw { flex: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; transition: background .15s; }
  .tgl .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .tgl[aria-checked="true"] { border-color: var(--accent); }
  .tgl[aria-checked="true"] .sw { background: var(--accent); }
  .tgl[aria-checked="true"] .sw::after { transform: translateX(20px); }
  .sub { margin: 8px 0 0 18px; padding-left: 12px; border-left: 3px solid var(--line); }
  ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

  /* Step layout: CDU beside the instruction on wide screens, stacked on narrow. */
  .step { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 820px) { .step { grid-template-columns: 360px minmax(0, 1fr); align-items: start; } }
  @media (max-width: 819px) { .instr { order: -1; } }
  .instr .section { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .instr h2 { margin: 6px 0 4px; font-size: 30px; line-height: 1.15; text-wrap: balance; }
  .instr .act { display: inline-block; margin: 6px 0 12px; padding: 6px 12px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 18px; }
  .instr .val { font-size: 22px; font-weight: 800; margin: 0 0 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .instr .val small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); font-family: inherit; text-transform: uppercase; letter-spacing: .6px; }
  .where { font-size: 15px; color: var(--muted); margin: 0 0 12px; }
  .where b { color: var(--text); }
  .note { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font-size: 15px; }
  .caution { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--amber-bg); color: var(--text); border-left: 5px solid var(--amber); font-size: 15px; }
  .caution b { color: var(--amber); }
  .ref { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .tick { display: flex; gap: 10px; align-items: center; width: 100%; margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel-2); cursor: pointer; font-weight: 600; text-align: left; }
  .tick .box { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 900; flex: none; }
  .tick[aria-checked="true"] { border-color: var(--go); }
  .tick[aria-checked="true"] .box { background: var(--go); border-color: var(--go); color: var(--panel); }

  /* ---------- CDU drawing ---------- */
  .cdu { background: var(--cdu-body); border-radius: 16px; padding: 14px 10px 16px; box-shadow: inset 0 0 0 2px #4a515b, 0 6px 18px rgba(0,0,0,.25); user-select: none; max-width: 360px; margin: 0 auto; width: 100%; }
  .cdu-top { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; gap: 6px; }
  .lsks { display: grid; grid-template-rows: 22px repeat(6, 1fr); gap: 0; padding-bottom: 18px; }
  .lsk { width: 28px; height: 16px; border-radius: 3px; background: var(--cdu-key); border: 1px solid #000; align-self: center; position: relative; }
  .lsk.hot { background: var(--cdu-hot); box-shadow: 0 0 0 3px rgba(255,207,74,.45), 0 0 14px rgba(255,207,74,.7); }
  .lsk-n { position: absolute; top: -13px; left: 0; right: 0; text-align: center; font-size: 9px; color: #c4cbd3; }
  .screen { background: var(--cdu-screen); border-radius: 6px; border: 3px solid var(--cdu-bezel); padding: 6px 6px 4px; color: var(--cdu-text); font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; display: grid; grid-template-rows: 22px repeat(6, 1fr) 18px; min-height: 206px; }
  .scr-title { text-align: center; font-size: 12px; letter-spacing: .5px; align-self: center; color: var(--cdu-text); }
  .scr-row { display: flex; justify-content: space-between; align-items: center; gap: 4px; min-width: 0; }
  .scr-row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--cdu-dim); }
  .scr-row span.on { color: var(--cdu-hot-ink); background: var(--cdu-hot); padding: 1px 3px; border-radius: 2px; font-weight: 700; }
  .scr-row span.lit { color: var(--cdu-text); }
  .scratch { border-top: 1px dashed #26303a; font-size: 10px; color: var(--cdu-dim); text-align: center; align-self: end; padding-top: 3px; }
  .scr-row span .lb { display: block; font-size: 9px; color: var(--cdu-dim); line-height: 1.1; }
  .scr-row span .dv { display: block; font-weight: 400; font-size: 12px; line-height: 1.2; color: var(--cdu-text); }
  .scr-row span.on .lb, .scr-row span.on .dv { color: var(--cdu-hot-ink); }
  .scratch.msg { font-size: 12px; color: var(--cdu-text); text-align: left; letter-spacing: .3px; }
  .result { margin-top: 14px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--go); background: var(--go-bg); }
  .result p { margin: 4px 0 0; font-size: 15px; }
  .result .screen.mini { margin-top: 10px; min-height: 0; grid-template-rows: 20px repeat(6, minmax(18px, auto)) 18px; font-size: 11px; max-width: 360px; }
  .keys { margin-top: 12px; display: grid; gap: 6px; }
  .krow { display: flex; gap: 6px; justify-content: flex-start; }
  .key { flex: 1 1 0; min-width: 0; height: 30px; border-radius: 5px; background: var(--cdu-key); color: var(--cdu-key-ink); border: 1px solid #000; display: grid; place-items: center; text-align: center; font: 700 8.5px/1.05 -apple-system, "Segoe UI", sans-serif; letter-spacing: .2px; padding: 0 2px; }
  .key.hot { background: var(--cdu-hot); color: var(--cdu-hot-ink); box-shadow: 0 0 0 3px rgba(255,207,74,.45), 0 0 14px rgba(255,207,74,.7); }
  .key.ghost { visibility: hidden; }
  .pad { display: grid; grid-template-columns: 3fr 5fr; gap: 10px; margin-top: 8px; }
  .pad .num, .pad .abc { display: grid; gap: 5px; }
  .pad .num { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 24px; }
  .pad .abc { grid-template-columns: repeat(5, 1fr); grid-auto-rows: 24px; }
  .pad .key { height: 24px; border-radius: 50%; font-size: 9px; opacity: .8; }
  .offcdu { display: grid; place-items: center; gap: 8px; min-height: 160px; text-align: center; padding: 18px; border-radius: 14px; border: 2px dashed var(--line); background: var(--panel-2); }
  .offcdu b { font-size: 20px; }
  .chip { display: inline-block; padding: 4px 10px; border-radius: 8px; background: var(--cdu-hot); color: var(--cdu-hot-ink); font-weight: 800; }

  /* Overview */
  .ov-group { margin-bottom: 14px; }
  .ov-group h3 { margin: 0 0 6px; font-size: 15px; }
  .ov-group h3 small { font-weight: 500; color: var(--muted); }
  .ov-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; background: var(--panel-2); margin-bottom: 4px; }
  .ov-row .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .ov-row .a { font-weight: 700; font-size: 14px; text-align: right; }
  .kb { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--line); margin-right: 6px; white-space: nowrap; }
  .instr h2 .kb { white-space: normal; display: inline-block; max-width: 100%; }

  /* Practice */
  .q-opts { display: grid; gap: 8px; }
  .q-opt { text-align: left; border: 1.5px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-weight: 600; min-height: 52px; }
  .q-opt.right { border-color: var(--go); background: var(--go-bg); }
  .q-opt.wrong { border-color: var(--red); background: var(--red-bg); }
  .score { font-variant-numeric: tabular-nums; font-weight: 800; }

  .pitem { padding: 10px 0; border-top: 1px solid var(--line); }
  .card .pitem:first-of-type { border-top: 0; }
  .prow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; }
  .pval { font: 800 20px/1.2 ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; }
  .pfrom { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .bitem { padding: 12px 0; border-top: 1px solid var(--line); }
  .card .bitem:first-of-type { border-top: 0; padding-top: 2px; }
  .bhead { display: flex; align-items: center; gap: 10px; }
  .bnum { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; }
  .say { margin: 8px 0 0; font-size: 19px; line-height: 1.35; font-weight: 600; }
  .reveal { margin-top: 8px; width: 100%; }
  .gouge .ggrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
  .gouge .g { padding: 10px; border-radius: 10px; background: var(--panel-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .gouge .gcode { font-size: 26px; letter-spacing: 2px; color: var(--accent); }
  .gouge .gwhat { font-size: 13px; font-weight: 700; }
  .gouge .gitems { font-size: 13px; color: var(--muted); }
  .count { display: inline-block; min-width: 1.6em; padding: 0 6px; border-radius: 6px; background: var(--amber-bg); color: var(--amber); font-weight: 800; text-align: center; }
  .method pre { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre; overflow-x: auto; }
  .paper summary { cursor: pointer; }
  .paper h4 { margin: 12px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .paper pre { margin: 0; padding: 10px; border-radius: 10px; background: var(--panel-2); font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; overflow-x: auto; white-space: pre; }
  .fmc { background: #05080b; border-color: #26303a; color: #e8f1ea; }
  .fmc .eyebrow { color: #ffcf4a; }
  .frow { display: block; width: 100%; text-align: left; background: transparent; color: #e8f1ea; border: 1.5px solid transparent; border-radius: 10px; padding: 10px; margin-top: 4px; cursor: pointer; }
  .frow .kb { background: #26303a; color: #c4cbd3; }
  .frow .pfrom { color: #c4cbd3; }
  .frow.flag { border-color: #ffcf4a; background: rgba(255,207,74,.12); }
  .frow.right { border-color: #3ddc84; background: rgba(61,220,132,.14); }
  .frow.missed { border-color: #ff6b5e; background: rgba(255,107,94,.16); }
  .frow.falseflag { border-color: #ffbe3d; background: rgba(255,190,61,.12); }
  .frow:disabled { cursor: default; }

  footer.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
  footer.nav .wrap { display: flex; gap: 10px; }
  .btn { min-height: 56px; border-radius: 14px; padding: 0 22px; font-weight: 700; font-size: 17px; cursor: pointer; border: 1.5px solid var(--line); background: var(--panel-2); }
  .btn.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .disclaimer { font-size: 12px; color: var(--muted); text-align: center; margin: 18px 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1>B737 Sim Prep</h1>
        <p id="sub">Study aid · Not for operational use</p>
      </div>
      <button class="icon-btn" id="btn-home" type="button">Home</button>
    </div>
    <div class="progress" id="prog" hidden><span></span></div>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<footer class="nav" id="nav">
  <div class="wrap">
    <button class="btn" id="btn-back" type="button">Back</button>
    <button class="btn primary" id="btn-next" type="button">Next</button>
  </div>
</footer>

<script src="procedure.js"></script>
<script src="perf.js"></script>
<script src="taxi.js"></script>
<script>
(() => {
  "use strict";
  const APP_VERSION = "2026-11-09.2"; // keep in step with VERSION in sw.js
  const { FLEETS, DEFAULTS, GROUPS, PAGES, TIMING, buildFlow } = window.SimPrep;
  const PERF = window.SimPerf;
  const TAXI = window.SimTaxi;

  // ---------- state ----------
  let st = { screen: "home", mode: null, block: "fms", briefHide: false, revealed: {}, opts: { ...DEFAULTS, perfAc: "NG", perfRwy: "17R", coSource: "UPLINK", rcOpt: "A", rcIntersection: false, briefKind: "preflight" }, i: 0, done: {}, quiz: null, score: { right: 0, total: 0 }, drill: null, drillScore: { clean: 0, total: 0 } };
  const SAVE_KEY = "simPrep.v2"; // v2: NG ship 3LE defaults (3LC–3PX, EO SID on, CPDLC on)
  const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); } catch (e) { /* storage unavailable */ } };
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (d && d.opts) st = { ...st, ...d, opts: { ...st.opts, ...d.opts } }; } catch (e) { /* ignore */ }

  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const flow = () => st.block === "closeout" ? TAXI.closeoutFlow(st.opts) : st.block === "change" ? TAXI.changeFlow(st.opts) : buildFlow(st.opts);
  const BLOCKS = {
    fms: { name: "FMS Preflight", done: "That's the FMS preflight. Ready for the Before Start Checklist." },
    closeout: { name: "Load Closeout", done: "Closeout loaded and checked. Brief Weights, Winds and N1s if nothing changed." },
    change: { name: "Runway change", done: "Runway change complete. Brief the 7-item Performance Review, then the Before Takeoff Checklist." },
  };
  const acName = (ac) => ac === "NG" ? "737-800 · 3LE" : "737 MAX 8 · 3RS";

  // ---------- CDU drawing (key layout from the AA CDU training guide, AOM Rev 10) ----------
  const FKEYS = [
    ["INIT REF", "RTE", "DEP ARR", "ATC", "VNAV", ""],
    ["FIX", "LEGS", "HOLD", "FMC COMM", "PROG", "EXEC"],
    ["MENU", "N1 LIMIT", "", "", "", ""],
    ["PREV PAGE", "NEXT PAGE", "", "", "", ""],
  ];
  const ALL_KEYS = new Set(FKEYS.flat().filter(Boolean));
  const keyHtml = (k, hot) => k ? `<div class="key${hot === k ? " hot" : ""}" ${hot === k ? 'aria-label="Press ' + esc(k) + '"' : 'aria-hidden="true"'}>${esc(k).replace(" ", "<br>")}</div>` : `<div class="key ghost"></div>`;

  // MAX ships use the "<page> MAX" layout where one exists (no 27K Bump line on N1 LIMIT).
  const isMax = () => (st.block === "closeout" || st.block === "change") ? st.opts.perfAc === "MAX" : ["C", "D"].includes(st.opts.fleet);
  const layoutFor = (page) => (isMax() && PAGES[page + " MAX"]) || PAGES[page] || null;

  // ---------- this flight's data on the CDU (RNO–SFO, AAL1080) ----------
  const POSN = "N39°29.9 W119°46.1"; // Reno, as an example position
  const ALIAS = { "ACT RTE 1": "RTE" };
  // Every field value for the flight, keyed "PAGE|LSK". speeds: tps | none | new | qrh. thrust: std | max.
  function flightValues(ac, rwy, speeds, thrust) {
    const F = PERF.FLIGHT, a = F[ac], r = a.rwy[rwy], fl = st.block === "fms" ? FLEETS[st.opts.fleet] : FLEETS[ac === "MAX" ? "C" : "A"];
    const tow = TAXI.WB[ac].tow.toFixed(1), gw = (a.zfw + a.fuelLoad).toFixed(1);

    return {
      "IDENT|1L": fl.model, "IDENT|1R": fl.rating,
      "POS INIT|1R": POSN, "POS INIT|4R": POSN,
      "POS REF 2/3|1L": POSN, "POS REF 2/3|4L": POSN, "POS REF 2/3|5L": POSN,
      "RTE|1L": "KRNO", "RTE|1R": "KSFO", "RTE|2R": "AAL1080", "RTE|3L": "RW" + rwy,
      "PERF INIT|1L": gw + "/", "PERF INIT|2L": a.fuelLoad.toFixed(1), "PERF INIT|3L": a.zfw.toFixed(1),
      "PERF INIT|4L": PERF.reserves().toFixed(1), "PERF INIT|5L": F.costIndex, "PERF INIT|1R": F.crzAlt, "PERF INIT|4R": "18000",
      "N1 LIMIT|1L": (thrust === "max" ? "--" : `+${r.at}°`) + "/ +5°C", "N1 LIMIT|1R": `${n1}/ ${n1}`, "N1 LIMIT|2L": `${a.rating} <ACT>`,
      "TAKEOFF REF 1/2|1L": "5°", "TAKEOFF REF 1/2|2L": `${n1}/ ${n1}`, "TAKEOFF REF 1/2|3L": "25.6%",
      "TAKEOFF REF 1/2|1R": sp(r.v1), "TAKEOFF REF 1/2|2R": sp(r.vr), "TAKEOFF REF 1/2|3R": sp(r.v2),
      "TAKEOFF REF 1/2|4R": `${tow}/ ${tow}`, "TAKEOFF REF 1/2|5L": "---/RW" + rwy,
      "TAKEOFF REF 2/2|1R": "WET", "TAKEOFF REF 2/2|2R": (thrust === "max" ? "--" : `+${r.at}°`) + "/ +5°C",
      "TAKEOFF REF 2/2|4L": `${r.accel}AGL`, "TAKEOFF REF 2/2|4R": `${r.accel}AGL`, "TAKEOFF REF 2/2|5L": `${r.accel}AGL`,
      "PROGRESS|1L": "RW" + rwy, "PROGRESS|2L": "MRLET", "PROGRESS|2R": "23", "PROGRESS|4L": `KSFO  ${F.distance}`,

      "DEPARTURES|1L": "ZEFFR", "DEPARTURES|1R": "08", "DEPARTURES|2R": rwy === "17L" ? "<SEL> 17L" : "17L", "DEPARTURES|3R": rwy === "17R" ? "<ACT> 17R" : "17R", "DEPARTURES|4R": "26", "DEPARTURES|5R": "35L",
      "LEGS|1L": ["23NM", "MRLET"], "LEGS|2L": ["89NM", "DYAMD"], "LEGS|3L": ["72NM", "ARCHI"], "LEGS|4L": ["26NM", "KSFO"], "LEGS|5L": "1.00/0.02NM",
      "RTE DATA|1L": "MRLET", "RTE DATA|2L": "DYAMD", "RTE DATA|3L": "ARCHI", "RTE DATA|4L": "KSFO",

    "ATC LOGON/STATUS|4L", "DEPARTURES|1L", "DEPARTURES|1R", "DEPARTURES|2R", "DEPARTURES|3R", "DEPARTURES|4R", "DEPARTURES|5R"];

  const EMPTY = {

      <div class="card"><h3>Departure</h3><div class="toggles">
        ${tgl("rnavSid", "RNAV SID assigned")}
        ${tgl("eoSid", "FMS engine-out SID available")}
      </div></div>
      <p class="hint">${flow().length} steps with these settings.</p>`;
    },

    sim: () => {
      const F = flow(); const s = F[st.i];
      if (!s) return `<h2 class="title">Done</h2><p class="lead">${esc((BLOCKS[st.block] || BLOCKS.fms).done)}</p>`;
      const groupSteps = F.filter((x) => x.g === s.g);
      const gi = groupSteps.indexOf(s) + 1;
      return `<div class="step">
        <div>${cdu(s, cduState(F, st.i))}</div>
        <div class="instr card">
          <div class="section">${esc(s.group.title)} · ${gi} of ${groupSteps.length}</div>
          <h2>${s.key && s.key.lsk ? `<span class="kb" style="font-size:20px">${esc(s.alt || "[" + s.key.lsk + "]")}</span>` : ""}${esc(s.label)}</h2>
          <span class="act">${esc(s.action)}</span>
          ${s.value ? `<p class="val"><small>Should read</small>${esc(s.value)}</p>` : ""}
          ${s.page ? `<p class="where">Page: <b>${esc(s.page)}</b></p>` : ""}
          ${s.caution ? `<p class="caution"><b>Caution:</b> ${esc(s.caution)}</p>` : ""}
          ${(s.notes || []).map((n) => `<p class="note">${esc(n)}</p>`).join("")}
          ${resultHtml(F, st.i)}
          <p class="ref">AOM ${esc(s.ref)} · step ${s.n} of ${F.length}</p>
          ${st.block === "change" && st.opts.rcOpt === "C" && s.g === "rcC" && s.n === F.find((x) => x.g === "rcC").n ? methodCard() : ""}
        </div>
      </div>`;
    },

    overview: () => {
      const F = flow(); let html = "", g = null;
      for (const s of F) {
        if (s.g !== g) { if (g) html += "</div>"; g = s.g; html += `<div class="ov-group card"><h3>${esc(s.group.title)} <small>· AOM ${esc(s.ref)}</small></h3>`; }
        html += `<div class="ov-row"><span class="n">${s.n}</span><span>${keyBadge(s) ? `<span class="kb">${esc(keyBadge(s))}</span>` : ""}${esc(s.label)}${s.value ? ` <b>${esc(s.value)}</b>` : ""}</span><span class="a">${esc(s.action)}</span></div>`;
      }
      return `<h2 class="title">Overview</h2><p class="lead">${esc(subLine())} · ${F.length} steps</p>${html}</div>`;
    },

    perfLearn: () => {
      const o = st.opts, list = PERF.items(o.perfAc, o.perfRwy);
      let html = "", page = null;
      for (const it of list) {
        if (it.page !== page) { if (page) html += "</div>"; page = it.page; html += `<div class="card"><span class="eyebrow">${esc(page)}</span>`; }
        html += `<div class="pitem"><div class="prow"><b>${it.lsk ? `<span class="kb">[${esc(it.lsk)}]</span>` : ""}${esc(it.label)}</b><span class="pval">${esc(it.value)}</span></div>
          <p class="pfrom">${esc(it.from)}</p>${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}</div>`;
      }
      html += "</div>";
      const rv = PERF.review(o.perfAc, o.perfRwy).map((r) => `<div class="pitem"><b>${esc(r.label)}</b><p class="pfrom">${esc(r.text)}</p></div>`).join("");
      return `<h2 class="title">Performance check</h2>
        <p class="lead">${o.perfAc === "NG" ? "737-800, ship 3LE" : "737 MAX 8, ship 3RS"} · RWY ${esc(o.perfRwy)}. One pilot reads aloud the FMC data; the other verifies it against the TPS, flight plan and ATIS. (AOM 3-32)</p>
        ${paperworkHtml()}${html}
        <div class="card"><span class="eyebrow">Performance review</span><p class="hint" style="margin-top:6px">Evaluate ATIS and TPS for wind, runway conditions, temperature, maximum weights, flaps, and thrust. (AOM 3-32)</p>${rv}</div>
        <p class="disclaimer">Values from the training flight paperwork. The MAX uses the NG flight plan figures for cost index, altitude and reserves (same flight).</p>`;
    },

    perfDrill: () => {
      const o = st.opts;
      if (!st.drill) st.drill = { rows: PERF.makeDrill(o.perfAc, o.perfRwy), flagged: {}, checked: false };
      const d = st.drill;
      let html = "", page = null;
      for (const it of d.rows) {
        if (it.page !== page) { if (page) html += "</div>"; page = it.page; html += `<div class="card fmc"><span class="eyebrow">${esc(page)}</span>`; }
        const f = !!d.flagged[it.id];
        let cls = f ? " flag" : "", verdict = "";
        if (d.checked) {
          if (it.wrong && f) { cls = " right"; verdict = `<p class="pfrom"><b>Caught.</b> ${esc(it.why)}</p>`; }
          else if (it.wrong) { cls = " missed"; verdict = `<p class="pfrom"><b>Missed.</b> ${esc(it.why)}</p>`; }
          else if (f) { cls = " falseflag"; verdict = `<p class="pfrom"><b>This one was correct.</b> ${esc(it.from)}</p>`; }
        }
        html += `<button type="button" class="frow${cls}" data-flagrow="${it.id}" ${d.checked ? "disabled" : ""} aria-pressed="${f}">
          <span class="prow"><span>${it.lsk ? `<span class="kb">[${esc(it.lsk)}]</span>` : ""}${esc(it.label)}</span><span class="pval">${esc(it.shown)}</span></span>${verdict}</button>`;
      }
      html += "</div>";
      const nWrong = d.rows.filter((r) => r.wrong).length;
      return `<h2 class="title">Find the mistakes</h2>
        <p class="lead">${o.perfAc === "NG" ? "737-800, ship 3LE" : "737 MAX 8, ship 3RS"} · RWY ${esc(o.perfRwy)}. Tap each FMC entry that doesn't match the paperwork, then tap <b>Check</b>.${d.checked ? ` This drill had ${nWrong} mistake${nWrong > 1 ? "s" : ""}.` : ""} Score: <span class="score">${st.drillScore.clean} / ${st.drillScore.total}</span> clean.</p>
        ${paperworkHtml()}${html}`;
    },

    brief: () => {
      const o = st.opts, B = TAXI.briefing(o.briefKind, o.perfAc, o.perfRwy);
      const items = B.items.map((it, i) => {
        const shown = !st.briefHide || st.revealed[i];
        return `<div class="bitem"><div class="bhead"><span class="bnum">${i + 1}</span><b>${esc(it.label)}</b></div>
          ${shown ? `<p class="say">“${esc(it.say)}”</p><p class="pfrom">${esc(it.check)}</p>` : `<button type="button" class="btn reveal" data-reveal="${i}">Say it, then tap to check</button>`}</div>`;
      }).join("");
      return `<h2 class="title">${esc(B.title)}</h2>
        <p class="lead"><span class="count">${B.count}</span> items · ${esc(acName(o.perfAc))}. ${esc(B.who)}</p>
        <div class="card"><span class="eyebrow">Situation</span><p style="margin:6px 0 0">${esc(B.setting)}</p></div>
        ${paperworkHtml()}
        ${gougeHtml(B.count)}
        <div class="card">${items}</div>
        <div class="card"><span class="eyebrow">Also discuss, if applicable</span><ul class="plain">${B.extra.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <p class="disclaimer">Wording follows the examples in the AA CDU training guide. Numbers from your RNO–SFO paperwork; the runway change is a practice scenario.</p>`;
    },

    quiz: () => {
      const q = st.quiz || newQuestion();
      st.quiz = q;
      const F = flow(); const prev = F[q.at];
      return `<h2 class="title">What comes next?</h2>
        <p class="lead">Score <span class="score">${st.score.right} / ${st.score.total}</span></p>
        <div class="card"><span class="eyebrow">${esc(prev.group.title)}</span>
          <p style="margin:6px 0 0;font-size:18px">You just did: ${keyBadge(prev) ? `<span class="kb">${esc(keyBadge(prev))}</span>` : ""}<b>${esc(prev.label)}</b> — ${esc(prev.action)}</p></div>
        <div class="q-opts">${q.options.map((o, i) => {
          const cls = q.picked == null ? "" : i === q.answer ? " right" : i === q.picked ? " wrong" : "";
          return `<button type="button" class="q-opt${cls}" data-pick="${i}" ${q.picked != null ? "disabled" : ""}>${keyBadge(o) ? `<span class="kb">${esc(keyBadge(o))}</span>` : ""}${esc(o.label)} — ${esc(o.action)}</button>`;
        }).join("")}</div>
        ${q.picked != null ? `<p class="note" style="margin-top:12px">${q.picked === q.answer ? "Correct." : "Not quite."} AOM ${esc(F[q.at + 1].ref)}.</p>` : ""}`;
    },
  };

  // Memory aid for the briefing order: WRT · WFT · R (7 items), W-W-N (3 items).
  function gougeHtml(count) {
    const grp = (code, what, items) => `<div class="g"><b class="gcode">${code}</b><span class="gwhat">${what}</span><span class="gitems">${items}</span></div>`;
    if (count === 7) return `<div class="card gouge"><span class="eyebrow">Gouge · WRT · WFT · R</span>
      <div class="ggrid">${grp("WRT", "Outside: the ATIS", "Wind · Runway conditions · Temperature")}${grp("WFT", "The airplane", "Weights · Flaps · Thrust")}${grp("R", "Where", "Runway")}</div></div>`;
    if (count === 3) return `<div class="card gouge"><span class="eyebrow">Gouge · W-W-N</span>
      <div class="ggrid">${grp("W", "", "Weights")}${grp("W", "", "Winds")}${grp("N", "", "N1s")}</div></div>`;
    return "";
  }

  // The Method 2 arithmetic for the tailwind option, from the TPS Airport Analysis data.
  function methodCard() {
    const m = TAXI.method2(st.opts.perfAc);
    return `<div class="card method"><span class="eyebrow">Unplanned tailwind · Method 2 · 17L</span>
      <p class="hint" style="margin-top:6px">${esc(TAXI.CHANGE.atisC)}</p>
      <pre>  ${m.zeroWind.toFixed(1)}  17L RWY limit, 5°C
- ${(m.sub / 1000).toFixed(2).padStart(5)}  ${m.perKt} × ${m.kt} kt tailwind
- ${m.aiSub.toFixed(2).padStart(5)}  A/I ON SUB
= ${m.rwy.toFixed(1)}  RUNWAY LIMIT
  ${m.climb.toFixed(1)}  CLIMB LIMIT − A/I
  ${m.mtow.toFixed(1)}  MTOW
GW ${m.gw.toFixed(1)}: ${m.ok ? "below all three" : "OVER A LIMIT"}</pre>
      <p class="note">Maximum thrust at the planned rating, FMC QRH V-speeds. Check the runway, climb and MTOW limits.</p></div>`;
  }
  const subLine = () => st.block === "closeout" ? `Load Closeout · ${acName(st.opts.perfAc)} · ${st.opts.perfRwy} · ${st.opts.coSource === "MANUAL" ? "Manual" : "Uplink"}`
    : st.block === "change" ? `Runway change 17R → 17L · ${acName(st.opts.perfAc)} · option ${st.opts.rcOpt}`
    : st.block === "brief" ? `Briefings · ${acName(st.opts.perfAc)}`
    : `${FLEETS[st.opts.fleet].label} · ${st.opts.source === "ACARS" ? "ACARS uplink" : "Manual entry"}`;

  // Practice: the correct next step plus three other steps from the same flow.
  function newQuestion() {
    const F = flow();
    const at = Math.floor(Math.random() * (F.length - 1));
    const right = F[at + 1];
    const sig = (s) => `${keyBadge(s)}|${s.label}|${s.action}`;
    const pool = F.filter((s) => sig(s) !== sig(right) && sig(s) !== sig(F[at]));
    const near = pool.filter((s) => Math.abs(s.n - right.n) <= 8);
    const pick = [];
    for (const src of [near, pool]) {
      const p = src.slice().sort(() => Math.random() - 0.5);
      for (const s of p) if (pick.length < 3 && !pick.some((x) => sig(x) === sig(s))) pick.push(s);
    }
    const options = [right, ...pick].sort(() => Math.random() - 0.5);
    return { at, options, answer: options.indexOf(right), picked: null };
  }

  // ---------- render ----------
  function render() {
    const scr = st.screen;
    $("#app").innerHTML = views[scr]();
    const F = flow();
    const prog = $("#prog");
    prog.hidden = scr !== "sim";
    if (scr === "sim") prog.firstElementChild.style.width = `${Math.min(100, (st.i / F.length) * 100)}%`;
    const nav = $("#nav"); nav.hidden = scr === "home";
    const back = $("#btn-back"), next = $("#btn-next");
    back.textContent = "Back";
    if (scr === "setup") { next.textContent = st.mode === "overview" ? "Show overview" : st.mode === "quiz" ? "Start practice" : st.mode === "perfDrill" ? "Start drill" : st.mode === "perfLearn" ? "Show the check" : st.mode === "brief" ? "Show the briefing" : "Start"; }
    else if (scr === "brief") { next.textContent = st.briefHide ? "Show all the words" : "Practice: hide the words"; }
    else if (scr === "sim") { next.textContent = st.i >= F.length ? "Home" : st.i === F.length - 1 ? "Finish" : "Next step"; }
    else if (scr === "quiz") { next.textContent = st.quiz && st.quiz.picked != null ? "Next question" : "Skip"; }
    else if (scr === "overview") { next.textContent = "Step by step"; }
    else if (scr === "perfLearn") { next.textContent = "Try a drill"; }
    else if (scr === "perfDrill") { next.textContent = st.drill && st.drill.checked ? "New drill" : "Check"; }
    const perf = scr.startsWith("perf") || (scr === "setup" && String(st.mode).startsWith("perf"));
    const blk = st.block && st.block !== "fms" && scr !== "home" && !perf;
    $("#sub").textContent = scr === "home" ? "Study aid · Not for operational use"
      : blk ? subLine()
      : perf ? `Performance check · RNO–SFO · ${st.opts.perfAc === "NG" ? "737-800" : "737 MAX 8"} · ${st.opts.perfRwy}`
      : `FMS Preflight · ${FLEETS[st.opts.fleet].label} · ${st.opts.source === "ACARS" ? "ACARS" : "Manual"}`;
    save();
  }
  const go = (screen) => { st.screen = screen; render(); window.scrollTo(0, 0); $("#app").focus({ preventScroll: true }); };

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.mode) { st.mode = b.dataset.mode; st.block = b.dataset.block || (b.dataset.mode.startsWith("perf") ? "perf" : "fms"); go("setup"); }
    else if (b.dataset.jump) {
      // Go straight to one section of the FMS preflight, with the options it needs switched on.
      st.mode = "sim"; st.block = "fms"; st.opts.source = "ACARS"; st.opts[b.dataset.jump] = true;
      st.i = Math.max(0, flow().findIndex((s) => s.g === b.dataset.jump)); st.done = {}; go("sim");
    }
    else if (b.dataset.reveal != null) { st.revealed[b.dataset.reveal] = true; render(); }
    else if (b.dataset.opt) { st.opts[b.dataset.opt] = b.dataset.val; st.i = 0; st.quiz = null; st.drill = null; st.revealed = {}; render(); }
    else if (b.dataset.flagrow && st.drill && !st.drill.checked) { st.drill.flagged[b.dataset.flagrow] = !st.drill.flagged[b.dataset.flagrow]; render(); }
    else if (b.dataset.flag) { st.opts[b.dataset.flag] = !st.opts[b.dataset.flag]; st.i = 0; st.quiz = null; render(); }
    else if (b.dataset.tick) { st.done[b.dataset.tick] = !st.done[b.dataset.tick]; render(); }
    else if (b.dataset.pick != null && st.quiz && st.quiz.picked == null) {
      st.quiz.picked = Number(b.dataset.pick); st.score.total++; if (st.quiz.picked === st.quiz.answer) st.score.right++; render();
    }
  });
  $("#btn-home").addEventListener("click", () => go("home"));
  $("#btn-back").addEventListener("click", () => {
    if (st.screen === "sim" && st.i > 0) { st.i--; render(); window.scrollTo(0, 0); }
    else if (st.screen === "setup") go("home");
    else go("setup");
  });
  $("#btn-next").addEventListener("click", () => {
    const F = flow();
    if (st.screen === "setup") { st.i = 0; st.done = {}; st.quiz = null; st.score = { right: 0, total: 0 }; st.drill = null; go(st.mode); }
    else if (st.screen === "brief") { st.briefHide = !st.briefHide; st.revealed = {}; render(); window.scrollTo(0, 0); }
    else if (st.screen === "perfLearn") { st.mode = "perfDrill"; st.drill = null; go("perfDrill"); }
    else if (st.screen === "perfDrill") {
      const d = st.drill;
      if (d && !d.checked) {
        d.checked = true; st.drillScore.total++;
        if (d.rows.every((r) => !!d.flagged[r.id] === r.wrong)) st.drillScore.clean++;
        render();
      } else { st.drill = null; render(); window.scrollTo(0, 0); }
    }
    else if (st.screen === "sim") {
      if (st.i >= F.length) { go("home"); return; }
      st.done[F[st.i].id] = true; st.i++; render(); window.scrollTo(0, 0);
    }
    else if (st.screen === "quiz") { st.quiz = null; render(); }
    else if (st.screen === "overview") { st.mode = "sim"; st.i = 0; go("sim"); }
  });
  document.addEventListener("keydown", (e) => {
    if (st.screen !== "sim") return;
    if (e.key === "ArrowRight") $("#btn-next").click();
    if (e.key === "ArrowLeft") $("#btn-back").click();
  });

  render();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
    // When a new version takes over, reload once so the screen shows it.
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }
  // Check for update: drop this app's saved copy and load the latest from the internet.
  document.addEventListener("click", async (e) => {
    if (!e.target.closest("#btn-update")) return;
    e.target.closest("#btn-update").textContent = "Updating…";
    try {
      const keys = await caches.keys();
      await Promise.all(keys.filter((k) => k.startsWith("sim-prep-")).map((k) => caches.delete(k)));
      const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
      await Promise.all(regs.filter((r) => r.scope.includes("/sim-prep/")).map((r) => r.unregister()));
    } catch (err) { /* offline or not supported: just reload */ }
    location.reload();
  });
})();
</script>
</body>
</html>
