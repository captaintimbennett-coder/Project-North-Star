<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b111c">
<title>Runway Change</title>
<meta name="apple-mobile-web-app-title" content="Runway Change">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --panel-2: #f5f7fa; --line: #d5dbe4; --text: #0e1622; --muted: #5a6577;
    --accent: #1d5fd1; --accent-ink: #ffffff; --go: #11804a; --go-bg: #e3f5eb; --amber: #9a5b00; --amber-bg: #fff2d6;
    --focus: #1d5fd1; --radius: 14px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b111c; --panel: #131b29; --panel-2: #1a2436; --line: #2a364c; --text: #e8edf5; --muted: #94a1b8;
      --accent: #5b9bff; --accent-ink: #06101f; --go: #3ddc84; --go-bg: #0f2a1d; --amber: #ffbe3d; --amber-bg: #2d2210;
      --focus: #8fbcff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b111c; --panel: #131b29; --panel-2: #1a2436; --line: #2a364c; --text: #e8edf5; --muted: #94a1b8;
    --accent: #5b9bff; --accent-ink: #06101f; --go: #3ddc84; --go-bg: #0f2a1d; --amber: #ffbe3d; --amber-bg: #2d2210;
    --focus: #8fbcff; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0 8px; }
  .hd h1 { margin: 0; font-size: 19px; }
  .hd small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  .btn { min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .bar span { display: block; height: 100%; background: var(--go); width: 0; transition: width .2s; }

  main { padding: 14px 0 150px; }
  .sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .sec h2 { margin: 0 0 4px; font-size: 18px; }
  .sec h3 { margin: 14px 0 6px; font-size: 15px; color: var(--muted); }
  .hint { margin: 0 0 8px; color: var(--muted); font-size: 14px; }

  .item { display: grid; grid-template-columns: 30px 22px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left;
    padding: 12px 10px; margin-top: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel-2); cursor: pointer; }
  .item .box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 900; }
  .item .n { color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; font-size: 14px; }
  .item .line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .item .t { font-weight: 600; flex: 1 1 auto; }
  .item .dots { flex: 1 1 24px; border-bottom: 2px dotted var(--line); min-width: 24px; transform: translateY(-4px); }
  .item .a { font-weight: 800; color: var(--accent); white-space: nowrap; }
  .item .k { display: inline-block; font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; padding: 1px 6px; border-radius: 6px; background: var(--line); margin-top: 4px; }
  .item .note { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .item[aria-checked="true"] { border-color: var(--go); background: var(--go-bg); }
  .item[aria-checked="true"] .box { background: var(--go); border-color: var(--go); color: var(--panel); }
  .item[aria-checked="true"] .t { opacity: .75; }
  .item.cur { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); background: var(--panel); }
  .sub { margin: 8px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .sub li { padding: 4px 0; border-top: 1px solid var(--line); }
  .sub li:first-child { border-top: 0; }
  .sub b { display: inline-block; min-width: 9.5em; }
  .wrt { display: inline-block; font-weight: 800; color: var(--accent); width: 2.4em; }

  .choose { display: grid; gap: 8px; margin-top: 8px; }
  .opt { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel-2); cursor: pointer; }
  .opt b { display: block; }
  .opt span { font-size: 14px; color: var(--muted); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .tgl { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel-2); cursor: pointer; margin-top: 8px; }
  .tgl .sw { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; }
  .tgl .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .tgl[aria-checked="true"] .sw { background: var(--go); }
  .tgl[aria-checked="true"] .sw::after { left: 23px; }
  details.cons { margin-top: 8px; font-size: 15px; }
  details.cons summary { cursor: pointer; font-weight: 700; color: var(--accent); }
  details.cons ul { margin: 6px 0 0; padding-left: 20px; }
  .done { text-align: center; padding: 18px; border-radius: var(--radius); background: var(--go-bg); color: var(--go); font-weight: 800; font-size: 18px; margin-bottom: 14px; }
  .disclaimer { color: var(--muted); font-size: 13px; text-align: center; margin: 18px 0; }

  footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
  .ft { display: flex; gap: 10px; }
  .ft .btn { flex: none; }
  .ft .go { flex: 1; min-height: 56px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 17px; text-align: left; padding: 8px 16px; }
  .ft .go small { display: block; font-size: 13px; font-weight: 600; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ft .go:disabled { opacity: .5; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

  .home { display: grid; gap: 12px; margin-top: 6px; }
  .big { text-align: left; padding: 18px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--panel); cursor: pointer; }
  .big b { display: block; font-size: 20px; }
  .big span { color: var(--muted); font-size: 15px; }
  .lead { color: var(--muted); margin: 0 0 12px; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .fld input, .fld select { font: 600 18px/1.2 ui-monospace, "SF Mono", Menlo, monospace; padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel-2); color: var(--text); width: 100%; min-height: 44px; }
  .fld.bad input { border-color: var(--red); }
  .fld small { font-weight: 500; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .seg button { flex: 1 1 auto; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel-2); font-weight: 700; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .q { margin-top: 12px; }
  .q > b { display: block; font-size: 15px; }
  .verdict { padding: 14px; border-radius: var(--radius); margin-top: 12px; border: 2px solid var(--line); }
  .verdict h3 { margin: 0 0 6px; font-size: 19px; color: inherit; }
  .verdict.ok { border-color: var(--go); background: var(--go-bg); }
  .verdict.amber { border-color: var(--amber); background: var(--amber-bg); }
  .verdict.stop { border-color: var(--red); background: var(--red-bg); }
  .verdict.pend { border-style: dashed; }
  .kv { margin: 4px 0; } .kv b { display: inline-block; min-width: 6.5em; }
  .why { margin: 8px 0 0; padding-left: 18px; font-size: 15px; } .why li { margin: 4px 0; } .why small { color: var(--muted); }
  .pick { margin-top: 10px; font-weight: 800; }
  :root { --red: #b42318; --red-bg: #fde6e4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --red: #ff6b5e; --red-bg: #321615; } }
  :root[data-theme="dark"] { --red: #ff6b5e; --red-bg: #321615; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <h1 id="title">Takeoff Data &amp; Runway Change<small id="subtitle">B737 · AOM 5.4.1 and the Takeoff Card</small></h1>
      <button class="btn" id="btn-home" type="button">Home</button>
    </div>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer id="foot">
  <div class="wrap ft">
    <button class="btn" id="btn-undo" type="button">Undo</button>
    <button class="btn go" id="btn-check" type="button">Check</button>
  </div>
</footer>

<script src="rules.js"></script>
<script src="checklist.js"></script>
<script src="decide.js"></script>
<script>
(() => {
  "use strict";
  const APP_VERSION = "2026-11-14.2"; // keep in step with VERSION in sw.js
  const RC = window.RwyChange, TR = window.TakeoffRules, TD = window.TakeoffDecide;
  const KEY = "rwyChange.v2";
  const KEEP_MS = 2 * 60 * 60 * 1000; // work in progress is kept for 2 hours

  const fresh = () => ({ screen: "home", option: null, manualOpt: false, intersection: false, done: {}, order: [], onTps: "first4", uplink: true, s: { ...TR.blank(), closeout: true, plan: "STD" }, at: Date.now() });
  let st = fresh();
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d && Date.now() - d.at < KEEP_MS) st = { ...st, ...d, s: { ...st.s, ...d.s } };
  } catch (e) { /* storage unavailable: start fresh */ }
  const save = () => { st.at = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* ignore */ } };

  const $ = (q) => document.querySelector(q);
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const S = () => st.s;
  const E = () => TR.evaluate(S());
  const decision = () => TD.decide(E(), st.screen === "change" ? { onTps: st.onTps, uplink: st.uplink } : { uplink: st.uplink });

  // In the runway change, the takeoff data finding chooses item 2's option unless the crew overrides it.
  function syncOption() {
    if (st.manualOpt) return;
    const d = decision();
    const opt = d.option || null;
    if (opt !== st.option) {
      if (st.option) clear(`2${st.option}.`);
      st.option = opt;
    }
  }

  const sections = () => RC.build({ option: st.option, intersection: st.intersection });
  const items = () => RC.flat(sections());
  function current() {
    for (const s of sections()) {
      if (s.choose && !st.option) return { needChoice: true };
      for (const it of s.parts ? s.parts.flatMap((p) => p.items) : s.items) if (!st.done[it.id]) return it;
    }
    return null;
  }
  const check = (id) => { st.done[id] = true; st.order.push(id); };
  const clear = (prefix) => { for (const k of Object.keys(st.done)) if (k.startsWith(prefix)) delete st.done[k]; st.order = st.order.filter((k) => !k.startsWith(prefix)); };

  // ---------- form pieces ----------
  const bad = (f) => E().invalid.some((v) => v.field === f);
  const fld = (f, label, hint, mode = "decimal") => `<label class="fld${bad(f) ? " bad" : ""}"><span>${esc(label)}${hint ? ` <small>${esc(hint)}</small>` : ""}</span>
    <input inputmode="${mode}" data-f="${f}" value="${esc(S()[f] ?? "")}" autocomplete="off"></label>`;
  const seg = (f, opts, label) => `<div class="q">${label ? `<b>${esc(label)}</b>` : ""}<div class="seg" role="group" aria-label="${esc(label || f)}">${opts.map(([v, t]) =>
    `<button type="button" data-fs="${f}" data-v="${esc(v)}" aria-pressed="${String(S()[f]) === String(v)}">${esc(t)}</button>`).join("")}</div></div>`;
  const tgl = (f, title, hint) => `<button type="button" class="tgl" role="switch" aria-checked="${!!S()[f]}" data-ft="${f}"><span><b>${esc(title)}</b>${hint ? `<br><span class="hint" style="margin:0">${esc(hint)}</span>` : ""}</span><span class="sw" aria-hidden="true"></span></button>`;
  const stSeg = (k, opts, label) => `<div class="q"><b>${esc(label)}</b><div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v, t]) =>
    `<button type="button" data-ss="${k}" data-v="${esc(v)}" aria-pressed="${String(st[k]) === String(v)}">${esc(t)}</button>`).join("")}</div></div>`;

  // The takeoff data questions. Rare conditions are folded away; follow-ups appear only when needed.
  function form(forChange) {
    const s = S(), e = E();
    const ratings = TR.RATINGS[s.aircraft] || TR.RATINGS.NG;
    let h = `<div class="sec"><h2>${forChange ? "Takeoff data for the new runway" : "Takeoff data"}</h2>
      <p class="hint">Enter the values from the TPS, the Load Closeout and the ATIS.</p>`;
    if (forChange) {
      h += stSeg("onTps", [["first4", "One of the first four"], ["notFirst4", "Not in the first four"], ["notOn", "Not on the TPS"]], "Is the new runway on the TPS?");
      h += `<button type="button" class="tgl" role="switch" aria-checked="${st.uplink}" data-ust="uplink"><span><b>Takeoff data uplink available and desired</b></span><span class="sw" aria-hidden="true"></span></button>`;
    }
    if (!forChange || st.onTps === "first4") {
      h += seg("aircraft", [["NG", "737-NG"], ["MAX8", "737 MAX 8"]], "Aircraft");
      h += seg("plan", [["STD", "Standard thrust (AT)"], ["MAX", "Maximum thrust"]], "TPS line for the runway");
      h += seg("rating", ratings.map((r) => [r, r]), "TPS thrust rating");
      h += seg("closeout", [["true", "Received"], ["false", "Not received"]], "Load Closeout");
      h += `<div class="fgrid">${fld("rwy", "Runway", "e.g. 17L", "text")}${fld("rwyHdg", "Runway heading", "Jeppesen", "numeric")}</div>`;
      h += `<div class="fgrid">${fld("tow", "Takeoff weight", "closeout")}${fld("ptow", "PTOW", "TPS")}${fld("mtow", "MTOW", "TPS line")}</div>`;
      h += seg("mtowCode", [["", "No letter"], ["L", "L"], ["E", "E"], ["D", "D"], ["T", "Other"]], "MTOW limit letter");
      h += `<div class="fgrid">${fld("oat", "Temperature", "ATIS °C")}${s.plan === "MAX" ? fld("planTemp", "Plan temperature", "TPS TEMP °C") : fld("at", "Assumed temperature", "TPS AT °C")}</div>`;
      h += `<div class="fgrid">${fld("windDir", "Wind direction", "°", "numeric")}${fld("windSpd", "Wind speed", "kt", "numeric")}${fld("windGust", "Gust", "kt", "numeric")}</div>`;
      h += tgl("calm", "Wind calm");
      h += seg("tpsWind", [["NONE", "Zero wind"], ["HEAD", "Headwind"], ["TAIL", "Tailwind"]], "TPS planned wind (no wind correction = zero wind)");
      if (s.tpsWind !== "NONE") h += `<div class="fgrid">${fld("tpsWindKt", s.tpsWind === "HEAD" ? "TPS headwind" : "TPS tailwind", "kt", "numeric")}</div>`;
      h += seg("runway", [["DRY", "Dry"], ["WET", "Wet"], ["CONTAM", "Contaminated"]], "Runway condition");
      h += tgl("tpsWet", "TPS header says WET");
      if (s.runway === "CONTAM") h += seg("contam", TR.CONTAM.map(([k, t]) => [k, t]), "Contaminant");
      // Follow-ups, only when the finding needs them.
      if (e.tail && !s.ip) {
        h += seg("twMethod", [["M1", "Method 1: new TPS"], ["M2", "Method 2: Airport Analysis"]], `Unplanned tailwind ${e.tail.tail} kt`);
        if (s.twMethod === "M2") h += `<div class="fgrid">${fld("zwMax", "Zero-wind max weight", "Airport Analysis")}${fld("twCorr", "Tailwind correction", "lb per kt", "numeric")}</div>`
          + seg("twSpeeds", [["QRH", "FMC QRH V-speeds"], ["AOM", "AOM V-speeds"]], "Method 2 V-speeds");
      }
      if (e.needAA) h += seg("aa", [["NOIP", "Yes, without IP"], ["IP", "Only with Improved Performance"], ["NO", "No"]], "Airport Analysis: can the weight be accommodated?");
      if (s.rating === "27K") h += tgl("bumpAuth", "27K Bump authorized", "SNA, or dispatch and load agent concurrence");
      h += `<details class="cons"><summary>More conditions</summary>
        ${tgl("windshear", "Windshear reported or expected", "Including advisories")}
        ${tgl("adv7", "Airport ops advisory (##-7) requires max thrust")}
        ${tgl("antiIce", "Engine anti-ice used for takeoff")}
        ${s.antiIce ? tgl("tpsAntiIce", "TPS shows ANTI-ICE ON") : ""}
        ${tgl("ip", "Improved Performance TPS")}
        ${tgl("melWt", "MEL/CDL item with a takeoff weight correction")}
        ${s.melWt ? tgl("melAuto", "Correction applied by TPS (TPAS)") : ""}
        ${tgl("crcmel", "Takeoff data from a CRC/MEL message")}
        ${tgl("flaps25", "Flaps 25 takeoff")}
        ${tgl("eecAlt", "EECs in Alternate mode")}
        ${tgl("trInop", "Thrust reverser inoperative")}
        ${s.runway === "CONTAM" ? tgl("antiSkidInop", "Anti-skid inoperative") + tgl("contamChunks", "Chunks of hardened snow or ice") : ""}
      </details>`;
    }
    return h + `</div>`;
  }

  // The finding, and for a runway change, the option it picks.
  function verdict(forChange) {
    const e = E(), d = decision();
    const cls = d.kind === "pending" ? "pend" : d.kind === "stop" ? "stop" : d.kind === "dispatch" || e.status === "amber" || d.option === "newTps" ? "amber" : "ok";
    const title = d.kind === "pending" ? "Not yet complete" : d.kind === "stop" ? "Stop: not authorized as entered" : d.kind === "dispatch" ? "Contact Dispatch" :
      d.option === "newTps" ? "New takeoff data required" : e.status === "amber" ? "Authorized with changes" : "Takeoff data valid";
    let h = `<div class="verdict ${cls}" role="status"><h3>${esc(title)}</h3>`;
    if (d.kind !== "pending" && !(forChange && st.onTps !== "first4")) h += `<p class="kv"><b>Thrust</b> ${esc(e.thrust)}</p><p class="kv"><b>V-speeds</b> ${esc(e.speeds)}</p>`;
    h += `<p style="margin:8px 0 0">${esc(d.why)}</p>`;
    if (e.invalid.length && !(forChange && st.onTps !== "first4")) h += `<ul class="why">${e.invalid.map((v) => `<li>${esc(v.msg)}</li>`).join("")}</ul>`;
    // A flagged entry shows only what to fix: no findings are drawn from a typo.
    if (!(forChange && st.onTps !== "first4") && !e.invalid.length) {
      const list = (t, xs) => xs.length ? `<p class="pick">${t}</p><ul class="why">${xs.map((x) => `<li>${x}</li>`).join("")}</ul>` : "";
      h += list("Do", e.actions.map(esc)) + list("Or", e.alts.map(esc)) + list("Cautions", e.cautions.map(esc))
        + list("Why", e.reasons.map((r) => `${esc(r.text)} <small>(${esc(r.sec)})</small>`));
    }
    if (forChange && d.option) h += `<p class="pick">→ Item 2: ${esc(RC.OPTIONS[d.option].title)}${d.manualSpeeds ? " (V-speeds not from the FMC QRH)" : ""}</p>`;
    return h + `</div>`;
  }

  const itemHtml = (it, cur) => {
    const on = !!st.done[it.id];
    const keyRef = it.key ? `${it.key} key` : it.lsk ? `LSK ${it.lsk}` : "";
    const rows = it.review ? TD.review(S(), E()) : null;
    const sub = it.fields ? `<ul class="sub">${it.fields.map(([f, d]) => `<li><b>${esc(f)}</b> ${esc(d)}</li>`).join("")}</ul>`
      : rows ? `<ul class="sub">${rows.map(([f, d], i) => `<li><span class="wrt">${["W", "R", "T", "W", "F", "T", "R"][i]}</span><b>${esc(f)}</b> ${esc(d)}</li>`).join("")}</ul>` : "";
    return `<button type="button" class="item${cur && cur.id === it.id ? " cur" : ""}" role="checkbox" aria-checked="${on}" data-id="${it.id}" id="i-${it.id.replace(/\W/g, "_")}">
      <span class="box" aria-hidden="true">${on ? "✓" : ""}</span><span class="n">${esc(it.num)}</span>
      <span><span class="line"><span class="t">${esc(it.text)}</span><span class="dots" aria-hidden="true"></span><span class="a">${esc(it.action)}</span></span>
      ${keyRef ? `<span class="k">${esc(keyRef)}</span>` : ""}${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}${sub}</span></button>`;
  };

  // ---------- screens ----------
  const views = {
    home: () => `<p class="lead">Takeoff data legality (the Takeoff Card) and the Runway/Departure Change (AOM 5.4.1) in one place.</p>
      <div class="home">
        <button type="button" class="big" data-go="change"><b>Runway change</b><span>Change the runway in the FMC, check the takeoff data for the new runway, and load it: the app picks the AOM option for you.</span></button>
        <button type="button" class="big" data-go="check"><b>Check takeoff data</b><span>Is the TPS still valid for the conditions? Thrust, V-speeds and what to do, with the card section for each finding.</span></button>
      </div>
      <button type="button" class="btn" id="btn-new" style="display:block;margin:14px auto 0">Start over</button>
      <p class="disclaimer">From the B737 Takeoff Card and ${esc(RC.SOURCE)}. Not approved for operational use; always use the current AOM.<br>Version ${APP_VERSION}</p>`,
    check: () => form(false) + verdict(false) + `<p class="disclaimer">Not approved for operational use. Version ${APP_VERSION}</p>`,
    change: () => {
      const cur = current();
      let html = cur ? "" : `<div class="done" role="status">✓ Runway/Departure Change complete</div>`;
      for (const s of sections()) {
        html += `<section class="sec"><h2>${esc(s.title)}</h2>`;
        if (s.note) html += `<p class="hint">${esc(s.note)}</p>`;
        if (s.id === "1") html += `<details class="cons"><summary>Takeoff Considerations</summary><ul>${RC.CONSIDERATIONS.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></details>`;
        if (s.choose) {
          html += `<p class="hint">Check the takeoff data for the new runway below. The result picks how to load it.</p></section>${form(true)}${verdict(true)}<section class="sec"><h2>2. Takeoff Performance: load the data</h2>`;
          html += `<button type="button" class="tgl" role="switch" aria-checked="${st.intersection}" data-flag="intersection"><span><b>Loading intersection takeoff data</b><br><span class="hint" style="margin:0">e.g., RWY 32LX</span></span><span class="sw" aria-hidden="true"></span></button>`;
          html += `<p class="hint" style="margin-top:12px"><b>Choose one:</b> ${st.manualOpt ? "chosen by you" : st.option ? "chosen from the takeoff data" : "answer the takeoff data above"}</p><div class="choose">${Object.entries(RC.OPTIONS).map(([k, v]) =>
            `<button type="button" class="opt" data-opt="${k}" aria-pressed="${st.option === k}"><b>${esc(v.title)}</b><span>${esc(v.when)}</span></button>`).join("")}</div>`;
          if (st.manualOpt) html += `<button type="button" class="btn" data-auto="1" style="margin-top:8px">Use the option from the takeoff data</button>`;
          for (const p of s.parts) html += `<h3>${esc(p.title)}</h3>${p.items.map((it) => itemHtml(it, cur)).join("")}`;
        } else html += s.items.map((it) => itemHtml(it, cur)).join("");
        html += `</section>`;
      }
      return html + `<p class="disclaimer">From ${esc(RC.SOURCE)} and the B737 Takeoff Card. Not approved for operational use.<br>Version ${APP_VERSION}</p>`;
    },
  };

  function render() {
    if (st.screen === "change") syncOption();
    $("#app").innerHTML = views[st.screen]();
    const inChange = st.screen === "change";
    $("#foot").hidden = !inChange;
    $("#btn-home").hidden = st.screen === "home";
    $("#subtitle").textContent = st.screen === "change" ? "Runway/Departure Change · AOM 5.4.1" : st.screen === "check" ? "Check takeoff data · B737 Takeoff Card" : "B737 · AOM 5.4.1 and the Takeoff Card";
    const all = inChange ? items() : [], n = all.filter((it) => st.done[it.id]).length;
    $("#bar").style.width = inChange && all.length ? `${(n / all.length) * 100}%` : "0%";
    if (inChange) {
      const cur = current(), go = $("#btn-check");
      if (!cur) { go.disabled = true; go.innerHTML = `Complete<small>${n} of ${all.length} items</small>`; }
      else if (cur.needChoice) { go.disabled = true; go.innerHTML = `Takeoff data first<small>Answer the questions for the new runway</small>`; }
      else { go.disabled = false; go.innerHTML = `✓ ${esc(cur.text)}<small>${esc(cur.action)} · ${n} of ${all.length} done</small>`; }
      $("#btn-undo").disabled = !st.order.length;
    }
    save();
  }
  const scrollToCurrent = () => {
    const c = current();
    const el = c && c.id ? document.getElementById(`i-${c.id.replace(/\W/g, "_")}`) : null;
    if (el) el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  };

  // ---------- events ----------
  const val = (v) => (v === "true" ? true : v === "false" ? false : v);
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.go) { st.screen = b.dataset.go; render(); window.scrollTo(0, 0); }
    else if (b.dataset.id) {
      const id = b.dataset.id;
      if (st.done[id]) { delete st.done[id]; st.order = st.order.filter((x) => x !== id); } else check(id);
      render();
    } else if (b.dataset.opt) {
      if (st.option && st.option !== b.dataset.opt) clear(`2${st.option}.`);
      st.option = b.dataset.opt; st.manualOpt = true; render();
    } else if (b.dataset.auto) { st.manualOpt = false; render(); }
    else if (b.dataset.flag) { st.intersection = !st.intersection; if (!st.intersection) clear("2x."); render(); }
    else if (b.dataset.fs) { S()[b.dataset.fs] = val(b.dataset.v); if (b.dataset.fs === "aircraft") S().rating = null; render(); }
    else if (b.dataset.ft) { S()[b.dataset.ft] = !S()[b.dataset.ft]; render(); }
    else if (b.dataset.ss) { st[b.dataset.ss] = b.dataset.v; render(); }
    else if (b.dataset.ust) { st.uplink = !st.uplink; render(); }
  });
  // Typed values update when the field is left or Return is pressed, so typing isn't interrupted.
  document.addEventListener("change", (e) => { const f = e.target.dataset && e.target.dataset.f; if (f) { S()[f] = e.target.value.trim(); render(); } });
  $("#btn-home").addEventListener("click", () => { st.screen = "home"; render(); window.scrollTo(0, 0); });
  $("#btn-check").addEventListener("click", () => { const c = current(); if (c && c.id) { check(c.id); render(); scrollToCurrent(); } });
  $("#btn-undo").addEventListener("click", () => { const id = st.order.pop(); if (id) delete st.done[id]; render(); scrollToCurrent(); });
  // Start over: clears the checklist and the takeoff data.
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#btn-new")) return;
    if (confirm("Start over? This clears the checklist and the takeoff data.")) { st = fresh(); render(); }
  });

  render();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }
})();
</script>
</body>
</html>
